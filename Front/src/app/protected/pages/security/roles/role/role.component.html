<div mat-dialog-title class="rcm-header">
    <span class="rcm-titulo">{{ titulo }}</span>
    <button mat-icon-button (click)="fn_close()">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content class="rcm-content">

    <div class="rcm-form">

        <div class="rcm-sistema-nota" *ngIf="bSistema">
            <mat-icon>lock</mat-icon>
            <span>Puesto del sistema: el nombre, el tipo y el estatus no se pueden cambiar. Sus acciones y menús sí se configuran.</span>
        </div>

        <div class="rcm-field">
            <label class="rcm-label">Nombre</label>
            <div class="inline-wrap">
                <input type="text" class="rcm-slim-input" [(ngModel)]="rolForm.name" [disabled]="bSistema">
            </div>
        </div>

        <div class="rcm-field">
            <label class="rcm-label">Tipo de puesto</label>
            <div class="inline-wrap">
                <select class="rcm-slim-input" [(ngModel)]="rolForm.idTipoRol" [disabled]="bSistema">
                    <option [ngValue]="null">Sin tipo</option>
                    <option *ngIf="bSistema" [ngValue]="rolForm.idTipoRol">Empleados</option>
                    <ng-container *ngIf="!bSistema">
                        <option *ngFor="let t of tiposRol" [ngValue]="t.idTipoRol">{{ t.nombre }}</option>
                    </ng-container>
                </select>
            </div>
            <small class="rcm-hint">Define en qué combos aparece quien tenga este puesto. No da permisos.</small>
        </div>

        <div class="rcm-field">
            <label class="rcm-label">Descripción</label>
            <div class="inline-wrap">
                <input type="text" class="rcm-slim-input" [(ngModel)]="rolForm.description">
            </div>
        </div>

        <div class="rcm-field">
            <mat-checkbox class="example-margin" [(ngModel)]="rolForm.active" disabled>Activo</mat-checkbox>
        </div>

    </div>

</mat-dialog-content>

<mat-dialog-actions align="end" class="rcm-actions">

    <button mat-stroked-button class="rcm-btn-secondary"
        type="button"
        (click)="fn_close()">
        <mat-icon>close</mat-icon>
        Cerrar</button>

    <button mat-flat-button class="rcm-btn-primary"
        type="submit"
        (click)="fn_saveRol()"
        [disabled]="rolForm.name.length == 0">
        <mat-icon>save</mat-icon>
        Guardar</button>

</mat-dialog-actions>

<app-spinner [hidden]="!bShowSpinner"></app-spinner>
