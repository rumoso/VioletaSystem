<div class="rcl-page">

  <!-- ═══════════════ FILTROS ═══════════════ -->
  <div class="rcl-card rcl-filters">

    <div class="rcl-filters-row">

      <div class="rcl-field rcl-field--search">
        <label class="rcl-label">Buscar</label>
        <div class="inline-wrap">
          <mat-icon class="rcl-slim-prefix-icon">search</mat-icon>
          <input type="text"
            class="rcl-slim-input rcl-slim-input--with-prefix"
            placeholder="Nombre o descripción..."
            (change)="onChangeEvent($event)">
        </div>
      </div>

    </div>

    <div class="rcl-filters-btns">
      <span class="rcl-count-badge">{{ pagination.length | number }} registros</span>
      <button mat-flat-button class="rcl-btn-add"
        (click)="changeRoute('rol')">
        <mat-icon>add</mat-icon>
        Nuevo rol
      </button>
    </div>

  </div>

  <!-- ═══════════════ TABLA ═══════════════ -->
  <div class="rcl-card rcl-content">

    <div class="rcl-table-wrapper">
      <table class="rcl-table">
        <thead>
          <tr>
            <th class="rcl-th rcl-th--center">Acciones</th>
            <th class="rcl-th rcl-th--left">Nombre</th>
            <th class="rcl-th rcl-th--left">Descripción</th>
            <th class="rcl-th rcl-th--center">Creado</th>
            <th class="rcl-th rcl-th--center">Activo</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of catlist" class="rcl-tr">

            <td class="rcl-td rcl-td--center rcl-td--actions">
              <div class="rcl-actions">

                <mat-icon class="rcl-action-icon rcl-action-icon--edit"
                  matTooltip="Editar Rol"
                  (click)="edit(item.idRol)">
                  edit
                </mat-icon>

                <mat-icon *ngIf="item.active"
                  class="rcl-action-icon rcl-action-icon--delete"
                  matTooltip="Eliminar Rol">
                  delete_outline
                </mat-icon>

                <mat-icon *ngIf="item.active"
                  class="rcl-action-icon rcl-action-icon--view"
                  matTooltip="Configurar permisos de acciones"
                  (click)="showActionsConf(item.idRol, item.name)">
                  https
                </mat-icon>

                <mat-icon *ngIf="item.active"
                  class="rcl-action-icon rcl-action-icon--view"
                  matTooltip="Configurar permisos de Menú"
                  (click)="showMenusPermisos(item.idRol, item.name)">
                  menu
                </mat-icon>

              </div>
            </td>

            <td class="rcl-td rcl-td--left">{{ item.name }}</td>
            <td class="rcl-td rcl-td--left">{{ item.description }}</td>

            <td class="rcl-td rcl-td--center">{{ item.createDate | date:'dd-MM-yyyy' }}</td>

            <td class="rcl-td rcl-td--center">
              <span class="rcl-status-chip" [class.rcl-status-chip--activo]="item.active" [class.rcl-status-chip--inactivo]="!item.active">
                {{ item.active ? 'Activo' : 'Inactivo' }}
              </span>
            </td>

          </tr>
          <tr *ngIf="!catlist || catlist.length === 0">
            <td colspan="5" class="rcl-empty">
              <mat-icon>admin_panel_settings</mat-icon>
              <span>No hay roles que mostrar.</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="rcl-pagination">
      <app-pagination *ngIf="catlist" [IPagination]="pagination"
        (OPagination)="changePagination($event)">
      </app-pagination>
    </div>

  </div>

</div>

<app-spinner [hidden]="!bShowSpinner"></app-spinner>
