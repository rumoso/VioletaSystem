<mat-sidenav-container fullscreen>

    <mat-sidenav #sidenav mode="push">
        <mat-toolbar >
            <span>Menú</span>

            <span class="spacer"></span>

            <button mat-icon-button
            (click)="sidenav.toggle()">
                <mat-icon>menu</mat-icon>
            </button>

        </mat-toolbar>

        <mat-expansion-panel [class.mat-elevation-z0]="true" *ngFor="let menuDad of _menuList">
            <mat-expansion-panel-header>
                {{ menuDad.name }}
            </mat-expansion-panel-header>
            <mat-nav-list *ngFor="let subMenu of menuDad.subMenus">
                <a mat-list-item (click)="changeRoute(subMenu.linkList)">
                    <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="user"></mat-icon>
<span>{{ subMenu.name }}</span>
                </a>
            </mat-nav-list>
        </mat-expansion-panel>

    </mat-sidenav>

    <!-- ══════════════════════ TOPBAR ══════════════════════ -->
    <mat-toolbar id="headerApp" class="app-topbar">

        <button mat-icon-button class="topbar-menu-btn" (click)="sidenav.toggle()">
            <mat-icon>menu</mat-icon>
        </button>

        <div class="topbar-brand manitaSobre" routerLink="./dashboard">
            <img class="topbar-logo" [src]="_IconApp" alt="">
            <span class="topbar-title">{{ _appName }}</span>
        </div>

        <span class="topbar-spacer"></span>

        <div class="topbar-user manitaSobre" (click)="showChangePwdModal()" matTooltip="Mi cuenta">
            <div class="topbar-avatar">{{ userLogin?.name?.charAt(0)?.toUpperCase() }}</div>
            <span class="topbar-user-name hide-on-small">{{ userLogin?.name }}</span>
        </div>

        <button mat-icon-button class="topbar-logout-btn" (click)="logout()" matTooltip="Cerrar sesión">
            <mat-icon>logout</mat-icon>
        </button>

    </mat-toolbar>

    <div class="container-fluid app-content">
        <router-outlet></router-outlet>
    </div>

</mat-sidenav-container>
