<div class="divMain pcl-main">

    <div class="pcl-header">
        <h2 class="pcl-titulo">Comisiones</h2>
    </div>

    <div class="pcl-filtros">
        <div class="pcl-slim-field">
            <label class="pcl-slim-label">Desde</label>
            <input class="pcl-slim-input" type="date" [formControl]="startDateControl" (change)="fn_buscar()">
        </div>

        <div class="pcl-slim-field">
            <label class="pcl-slim-label">Hasta</label>
            <input class="pcl-slim-input" type="date" [formControl]="endDateControl" (change)="fn_buscar()">
        </div>

        <div class="pcl-filtro-botones">
            <button mat-raised-button type="button" (click)="fn_limpiar()">
                <mat-icon matPrefix class="my-icon">clear</mat-icon>
                Limpiar</button>

            <button mat-raised-button type="button" (click)="fn_getList()">
                <mat-icon matPrefix class="my-icon">refresh</mat-icon>
                Actualizar</button>

            <button mat-raised-button color="accent" type="button"
            (click)="fn_abrirTracking(null)">
                <mat-icon matPrefix class="my-icon">manage_search</mat-icon>
                Ver todo el tracking</button>
        </div>
    </div>

    <div class="pcl-vacio" *ngIf="catlist.length === 0 && !bShowSpinner">
        <mat-icon class="pcl-vacio-icon">payments</mat-icon>
        <p>Sin comisiones en ese rango de fechas.</p>
    </div>

    <!-- Resumen por empleado: total sin cobrar en el rango -->
    <div class="table-responsive" *ngIf="catlist.length > 0">
        <table class="pcl-tabla">
            <thead>
                <tr>
                    <th class="textAlingLeft">Empleado</th>
                    <th class="textAlingCenter">Movimientos</th>
                    <th class="textAlingCenter">Pendientes</th>
                    <th class="textAlingRight">Total sin cobrar</th>
                    <th class="textAlingCenter">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of catlist" class="ctl-row" (click)="fn_abrirTracking(item)">
                    <td>
                        <div class="pcl-persona">
                            <div class="pcl-avatar" [style.background-color]="fn_avatarColor(item.nombreEmpleado)">
                                {{ fn_inicial(item.nombreEmpleado) }}
                            </div>
                            <span class="pcl-principal">{{ item.nombreEmpleado }}</span>
                        </div>
                    </td>
                    <td class="textAlingCenter pcl-secundario">{{ item.iMovimientos }}</td>
                    <td class="textAlingCenter">
                        <span class="pcl-chip" [class.pcl-chip-activo]="item.iPendientes > 0" [class.pcl-chip-neutro]="item.iPendientes == 0">
                            {{ item.iPendientes }}
                        </span>
                    </td>
                    <td class="textAlingRight ctl-monto" [class.ctl-monto-negativo]="item.totalPendiente < 0">
                        {{ item.totalPendiente | currency }}
                    </td>
                    <td class="textAlingCenter">
                        <button mat-icon-button matTooltip="Ver tracking" (click)="$event.stopPropagation(); fn_abrirTracking(item)">
                            <mat-icon class="colorGreen">manage_search</mat-icon>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <app-pagination *ngIf="catlist.length > 0" [IPagination]="pagination"
                    (OPagination)="changePagination($event)">
    </app-pagination>

</div>

<app-spinner [hidden]="!bShowSpinner"></app-spinner>
