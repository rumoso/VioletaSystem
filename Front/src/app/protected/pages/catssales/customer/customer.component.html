<div class="ctm-modal">

    <div mat-dialog-title class="ctm-header">
        <span class="ctm-titulo">
            {{ ( id ) ? 'Editar' : 'Nuevo' }} {{ title }}
        </span>
        <button mat-icon-button (click)="close()">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <mat-dialog-content class="ctm-content">

        <div class="ctm-grid">

            <div class="ctm-slim-field">
                <label class="ctm-slim-label">Apellidos</label>
                <input id="tbxLastName" class="ctm-slim-input" type="text" autocomplete="off"
                    placeholder="Ingrese los apellidos"
                    [(ngModel)]="customerForm.lastName"
                    (keyup.enter)="ev_fn_nextInput_keyup_enter('tbxName')">
            </div>

            <div class="ctm-slim-field">
                <label class="ctm-slim-label">Nombre *</label>
                <input id="tbxName" class="ctm-slim-input" type="text" autocomplete="off"
                    placeholder="Ingrese el nombre"
                    [(ngModel)]="customerForm.name"
                    (keyup.enter)="ev_fn_nextInput_keyup_enter('tbxTel')">
            </div>

            <div class="ctm-slim-field">
                <label class="ctm-slim-label">Teléfono</label>
                <div class="ctm-inline-wrap">
                    <mat-icon class="ctm-prefix-icon">phone</mat-icon>
                    <input id="tbxTel" class="ctm-slim-input" type="text" autocomplete="off"
                        placeholder="Ingrese un teléfono"
                        [(ngModel)]="customerForm.tel"
                        (keyup.enter)="ev_fn_nextInput_keyup_enter('tbxEmail')">
                </div>
            </div>

            <div class="ctm-slim-field">
                <label class="ctm-slim-label">Correo electrónico</label>
                <div class="ctm-inline-wrap">
                    <mat-icon class="ctm-prefix-icon">mail_outline</mat-icon>
                    <input id="tbxEmail" class="ctm-slim-input" type="text" autocomplete="off"
                        placeholder="Ingrese un correo electrónico"
                        [(ngModel)]="customerForm.eMail"
                        (keyup.enter)="ev_fn_nextInput_keyup_enter('tbxAddress')">
                </div>
            </div>

            <div class="ctm-slim-field ctm-col-2">
                <label class="ctm-slim-label">Dirección</label>
                <div class="ctm-inline-wrap">
                    <mat-icon class="ctm-prefix-icon">place</mat-icon>
                    <input id="tbxAddress" class="ctm-slim-input" type="text" autocomplete="off"
                        placeholder="Ingrese la dirección"
                        [(ngModel)]="customerForm.address"
                        (keyup.enter)="ev_fn_nextInput_keyup_enter('btnSave')">
                </div>
            </div>

            <div class="ctm-slim-field ctm-col-2 ctm-activo">
                <mat-checkbox color="primary" [(ngModel)]="customerForm.active">Activo</mat-checkbox>
            </div>

        </div>

    </mat-dialog-content>

    <mat-dialog-actions align="end" class="ctm-actions">

        <app-face-id-button *ngIf="id > 0"
            class="ctm-faceid"
            tipoPersona="CLIENTE"
            [idPersona]="id"
            [nombrePersona]="name">
        </app-face-id-button>

        <button mat-stroked-button type="button" class="ctm-btn-secondary" (click)="close()">
            <mat-icon>close</mat-icon>
            Cerrar</button>

        <button id="btnSave" mat-flat-button type="submit" class="ctm-btn-primary"
            *ngIf="customerForm.idCustomer != 1160"
            [disabled]="!fn_validForm()"
            (click)="fn_saveCustomer()">
            <mat-icon>save</mat-icon>
            Guardar</button>

    </mat-dialog-actions>

</div>

<app-spinner [hidden]="!bShowSpinner"></app-spinner>
