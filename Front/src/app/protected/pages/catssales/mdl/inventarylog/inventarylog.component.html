<div class="ivm-modal">

    <div mat-dialog-title class="ivm-header">
        <span class="ivm-titulo">Puedes agregar o quitar inventario</span>
        <button mat-icon-button type="button" (click)="fn_CerrarMDL()">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <mat-dialog-content class="ivm-content">

        <div class="ivm-grid">

            <div class="ivm-slim-field">
                <label class="ivm-slim-label"># Entrada</label>
                <input #tbxNoEntrada class="ivm-slim-input" type="text" autocomplete="off"
                    placeholder="Número de entrada"
                    [(ngModel)]="inventaryLogForm.noEntrada"
                    (keydown.enter)="ev_fn_noEntrada_keyup_enter( $event )">
            </div>

            <div class="ivm-slim-field ivm-col-2">
                <label class="ivm-slim-label">Descripción</label>
                <input #tbxDescription class="ivm-slim-input" type="text" autocomplete="off"
                    placeholder="Motivo del movimiento"
                    [(ngModel)]="inventaryLogForm.description"
                    (keydown.enter)="ev_fn_description_keyup_enter( $event )">
            </div>

            <div class="ivm-slim-field">
                <label class="ivm-slim-label">Cantidad</label>
                <input #tbxCantidad class="ivm-slim-input ivm-cantidad" type="number"
                    placeholder="0"
                    [class.ivm-negativo]="inventaryLogForm.cantidad < 0"
                    [(ngModel)]="inventaryLogForm.cantidad"
                    (keydown.enter)="ev_fn_amount_keyup_enter( $event )">
                <span class="ivm-slim-hint">Negativa para quitar (requiere autorización).</span>
            </div>

            <div class="ivm-slim-field">
                <label class="ivm-slim-label">Nuevo costo</label>
                <div class="ivm-inline-wrap">
                    <mat-icon class="ivm-inline-icon">attach_money</mat-icon>
                    <input id="tbxCostM" class="ivm-slim-input ivm-num" type="number"
                        placeholder="0.00"
                        [(ngModel)]="inventaryLogForm.newCost"
                        (keydown.enter)="ev_fn_newCost_keyup_enter( $event )">
                </div>
            </div>

            <div class="ivm-slim-field">
                <label class="ivm-slim-label">Nuevo precio</label>
                <div class="ivm-inline-wrap">
                    <mat-icon class="ivm-inline-icon">attach_money</mat-icon>
                    <input id="tbxPriceM" class="ivm-slim-input ivm-num" type="number"
                        placeholder="0.00"
                        [(ngModel)]="inventaryLogForm.newPrice"
                        (keydown.enter)="ev_fn_newPrice_keyup_enter( $event )">
                </div>
            </div>

        </div>

    </mat-dialog-content>

    <mat-dialog-actions align="end" class="ivm-actions">

        <button mat-raised-button type="button" (click)="fn_CerrarMDL()">
            <mat-icon matPrefix class="my-icon">close</mat-icon>
            Cerrar</button>

        <button mat-raised-button type="button" (click)="event_clear()">
            <mat-icon matPrefix class="my-icon">cleaning_services</mat-icon>
            Limpiar</button>

        <button mat-raised-button color="primary" type="submit"
            [disabled]="!fn_validForm()"
            (click)="fn_insertInventaryLog()">
            <mat-icon matPrefix class="my-icon">save</mat-icon>
            Guardar</button>

    </mat-dialog-actions>

</div>

<app-spinner [hidden]="!bShowSpinner"></app-spinner>
